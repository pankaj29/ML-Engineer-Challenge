# =============================================================================
# Continuous integration.
#
# Plain English:
#   Every push and pull request runs this pipeline. It is the gate that stops
#   broken code reaching the main branch.
#
# The jobs are ordered cheapest-first, so obvious problems fail in seconds
# rather than after a twenty-minute model download:
#
#   1. lint        seconds   — formatting, obvious mistakes, type errors
#   2. test        ~2 min    — the full suite against fakes, with a coverage gate
#   3. security    ~1 min    — dependency CVEs and hardcoded secrets
#   4. docker      ~5 min    — the images actually build and start
#   5. models      ~10 min   — real artifacts, real inference (main branch only)
#
# Jobs run in parallel where they can. `needs:` is used only where a real
# dependency exists, so a lint failure does not waste ten minutes of runner
# time on the model job.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Allows a manual run from the Actions tab, which is invaluable when
  # debugging the pipeline itself.
  workflow_dispatch:

# Cancel an in-progress run when a new commit is pushed to the same branch.
# Without this, pushing three fixes in quick succession runs three full
# pipelines and you wait for the results of two you no longer care about.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Keep pip quiet and deterministic in CI output.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint and type-check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        # Model artifacts are stored in Git LFS. Without this, checkout
        # writes ~130-byte pointer TEXT files in their place - which exist
        # on disk, so any 'is the artifact present?' check passes, and the
        # failure only surfaces later as an unparseable ONNX file.
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        # Only the linters, not the full dependency tree: this job must stay
        # fast, and ruff/black do not need PyTorch to check syntax.
        run: pip install ruff black mypy

      - name: Ruff (lint)
        run: ruff check api/ models/ worker/ db/ scripts/ tests/

      - name: Black (formatting)
        run: black --check --diff api/ models/ worker/ db/ scripts/ tests/

      # The Colab notebook is generated from scripts/build_colab_notebook.py.
      # Editors save execution outputs back into it, which silently overwrites
      # generated content - so verify the committed copy still matches its
      # source rather than discovering it mid-run on a GPU.
      - name: Colab notebook is up to date
        run: python scripts/build_colab_notebook.py --check

      - name: Mypy (types)
        # Type checking is advisory for now: the codebase is fully annotated,
        # but several third-party libraries ship no stubs, and failing the
        # build on someone else's missing annotations is not useful.
        # Remove `continue-on-error` once the ignore list is settled.
        continue-on-error: true
        run: mypy api/ --ignore-missing-imports --no-strict-optional

  # ---------------------------------------------------------------------------
  # 2. Tests
  # ---------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      # Run every version even if one fails, so a 3.12-only problem is visible
      # in the same run rather than one version at a time.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        # Model artifacts are stored in Git LFS. Without this, checkout
        # writes ~130-byte pointer TEXT files in their place - which exist
        # on disk, so any 'is the artifact present?' check passes, and the
        # failure only surfaces later as an unparseable ONNX file.
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # CPU-only PyTorch. The default wheel pulls ~2 GB of CUDA libraries
        # that a GitHub runner has no GPU to use.
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
                      -r requirements-dev.txt

      # Tiny-ImageNet is 240 MB / 100k files and is NOT in the repo - it is
      # reproducible from this script, so committing it would be waste. The 14
      # dataset tests skip without it, so CI fetches it once and caches it.
      - name: Cache Tiny-ImageNet
        id: cache-tiny-imagenet
        uses: actions/cache@v4
        with:
          path: data/tiny-imagenet-200
          key: tiny-imagenet-200-v1

      - name: Download Tiny-ImageNet
        if: steps.cache-tiny-imagenet.outputs.cache-hit != 'true'
        # continue-on-error on purpose: this reaches out to an external host
        # (cs231n.stanford.edu). If it is slow or down, the dataset tests skip
        # with a clear reason - which is what they did before this step
        # existed. A third party's uptime must not decide whether our build is
        # green.
        continue-on-error: true
        run: python scripts/download_datasets.py --dataset tiny_imagenet --data-dir data

      - name: Run tests with coverage
        # Performance tests are excluded: timing assertions on shared CI
        # hardware are flaky, and a flaky gate is worse than no gate. They run
        # on demand instead.
        # No env block here on purpose. tests/conftest.py sets ENVIRONMENT,
        # AUTH_ENABLED, API_KEYS and JWT_SECRET itself, and the tests hard-code
        # the key names. Exporting a different API_KEYS here made every
        # authenticated request 401 and turned the whole suite red.
        run: |
          pytest tests/ \
            -m "not performance" \
            --cov=api --cov=worker --cov=models \
            --cov-report=xml --cov-report=term-missing \
            --junitxml=junit.xml \
            -v

      - name: Enforce the coverage floor
        # 92, against an actual 95.8% on api/. The gap is on purpose: if the
        # Git LFS fetch fails, the artifact-dependent tests skip and coverage
        # drops a point or two. A gate set at the achieved number turns an
        # infrastructure hiccup into a coverage failure, which sends the next
        # person hunting in the wrong place.
        #
        # It must never sit below the standard it guards. The brief requires
        # 85% on critical paths and targets 90% for unit tests; a gate looser
        # than either would look like assurance while providing none.
        #
        # This is a hard gate, not a report nobody reads.
        run: |
          pytest tests/ -m "not performance" \
            --cov=api --cov-fail-under=92 --cov-report=term -q

      # The README quotes test counts and a coverage figure. Those are correct
      # the day they are written and quietly wrong a fortnight later, and a
      # reviewer who spots one stale number has no reason to trust the rest.
      # Runs after the coverage step so .coverage exists to read.
      - name: README statistics match the repository
        run: python scripts/check_readme_stats.py

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

      - name: Upload test results
        # `always()` so results are published even when tests failed — which
        # is precisely when you most want to see them.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: junit.xml
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 3. Security
  # ---------------------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        # Model artifacts are stored in Git LFS. Without this, checkout
        # writes ~130-byte pointer TEXT files in their place - which exist
        # on disk, so any 'is the artifact present?' check passes, and the
        # failure only surfaces later as an unparseable ONNX file.
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install scanners
        run: pip install pip-audit bandit[toml]

      - name: Audit dependencies for known CVEs
        # Advisory: a new CVE in a transitive dependency should surface loudly
        # but must not block an unrelated bug fix from merging.
        continue-on-error: true
        run: pip-audit -r requirements.txt --desc

      - name: Static security analysis
        # -ll reports medium severity and above; low-severity findings on a
        # codebase this size are mostly noise.
        continue-on-error: true
        run: bandit -r api/ worker/ models/ -ll -f screen

      - name: Check for hardcoded secrets
        # A deliberately simple grep rather than a heavyweight scanner. It
        # catches the realistic mistake — a key pasted into a source file —
        # and costs nothing. `.env.example` is excluded because its
        # placeholders are the point.
        run: |
          echo "Scanning for committed secrets..."
          if grep -rEn "(api[_-]?key|secret|password|token)\s*=\s*['\"][A-Za-z0-9_\-]{16,}['\"]" \
               --include="*.py" --include="*.yml" --include="*.yaml" \
               api/ worker/ models/ db/ scripts/ docker/ monitoring/ 2>/dev/null; then
            echo "::error::A hardcoded secret appears to be committed. Move it to an environment variable."
            exit 1
          fi
          echo "No hardcoded secrets found."

      - name: Ensure .env is not committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is committed. It must stay gitignored."
            exit 1
          fi
          echo ".env is correctly untracked."

  # ---------------------------------------------------------------------------
  # 4. Docker
  # ---------------------------------------------------------------------------
  docker:
    name: Build and smoke-test images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only after the cheap checks pass: a ten-minute image build should not be
    # spent on code that does not lint.
    needs: [lint]

    steps:
      - uses: actions/checkout@v4
        # Model artifacts are stored in Git LFS. Without this, checkout
        # writes ~130-byte pointer TEXT files in their place - which exist
        # on disk, so any 'is the artifact present?' check passes, and the
        # failure only surfaces later as an unparseable ONNX file.
        with:
          lfs: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: mlcv/api:ci
          load: true
          # GitHub Actions cache: without it every run reinstalls PyTorch from
          # scratch, which dominates the build time.
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build the worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.worker
          tags: mlcv/worker:ci
          load: true
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: Build the gateway image
        # The Dockerfile runs `nginx -t` internally, so a bad config fails here.
        uses: docker/build-push-action@v6
        with:
          context: docker/nginx
          tags: mlcv/gateway:ci
          load: true
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max

      - name: Verify the images run as a non-root user
        # A container running as root is a real escalation risk, and it is an
        # easy property to lose by accident during a refactor.
        run: |
          for image in mlcv/api:ci mlcv/worker:ci; do
            user=$(docker run --rm --entrypoint sh "$image" -c 'id -u')
            echo "$image runs as uid $user"
            if [ "$user" = "0" ]; then
              echo "::error::$image runs as root"
              exit 1
            fi
          done

      - name: Validate the compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          echo "docker-compose.yml is valid"

          JWT_SECRET=ci-secret-long-enough-for-production-validation-check \
          API_KEYS=ci:pro POSTGRES_PASSWORD=ci REDIS_PASSWORD=ci GRAFANA_PASSWORD=ci \
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          echo "production overlay is valid"

      - name: Verify production refuses to start without secrets
        # The fail-closed behaviour is a security control, so it gets a test.
        run: |
          if docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet 2>/dev/null; then
            echo "::error::The production overlay started without secrets. It must fail closed."
            exit 1
          fi
          echo "Production correctly refuses to start without secrets."

      - name: Smoke-test the API container
        # Starts with no models registered, which is exactly the "degraded but
        # alive" path: liveness must still pass.
        run: |
          docker run -d --name api-smoke \
            -e ENVIRONMENT=local \
            -e EAGER_MODEL_LOAD=false \
            -e AUTH_ENABLED=false \
            -e CACHE_ENABLED=false \
            -p 8000:8000 \
            mlcv/api:ci

          echo "Waiting for the API to come up..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health/live >/dev/null 2>&1; then
              echo "API is live after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::The API did not become live within 30s"
              docker logs api-smoke
              exit 1
            fi
            sleep 1
          done

          echo "--- liveness ---"
          curl -fsS http://localhost:8000/api/v1/health/live
          echo
          echo "--- metrics ---"
          curl -fsS http://localhost:8000/api/v1/metrics | head -5
          echo
          echo "--- openapi ---"
          curl -fsS http://localhost:8000/openapi.json | python -c \
            "import json,sys; print(len(json.load(sys.stdin)['paths']), 'documented paths')"

          docker rm -f api-smoke

  # ---------------------------------------------------------------------------
  # 5. End to end, against the deployed stack
  # ---------------------------------------------------------------------------
  e2e:
    name: End-to-end (deployed stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # After lint only. This job builds images and starts seven services, which
    # is too expensive to spend on code that does not lint, but it does not
    # need the unit suite to finish first - the two are independent and run in
    # parallel.
    needs: [lint]

    steps:
      - uses: actions/checkout@v4
        # The e2e suite compares what the container serves against the
        # artifacts in the working tree, so both sides need the real files.
        # With LFS pointers the comparison would pass by matching two
        # placeholders.
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        # The suite drives the stack over HTTP, but the staleness check also
        # loads the local ONNX to compare predictions, so the runner needs the
        # inference stack too. CPU-only torch: no GPU here.
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
                      -r requirements-dev.txt

      - name: Start the stack
        run: |
          docker compose up -d --build
          docker compose ps

      - name: Wait for every service to report healthy
        # Polling the gateway is not enough: nginx answers before the API has
        # loaded its models, and an e2e failure at that point looks like a
        # broken endpoint rather than a slow start.
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/api/v1/health/live >/dev/null 2>&1; then
              echo "gateway is live after ${i}s"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::the stack did not come up within 60s"
              docker compose ps
              docker compose logs --tail 80
              exit 1
            fi
            sleep 1
          done

          echo "--- waiting for the API to finish loading models ---"
          for i in $(seq 1 90); do
            status=$(curl -fsS http://localhost/api/v1/health | \
                     python -c "import json,sys; print(json.load(sys.stdin)['status'])" \
                     2>/dev/null || echo pending)
            if [ "$status" = "healthy" ]; then
              echo "healthy after ${i}s"
              break
            fi
            if [ "$i" = "90" ]; then
              echo "::warning::health is '$status' rather than 'healthy' after 90s"
              curl -fsS http://localhost/api/v1/health | python -m json.tool || true
            fi
            sleep 1
          done

      - name: Run the end-to-end suite
        # No --skip guard here on purpose. The tests skip themselves when the
        # gateway is unreachable, which is right on a laptop and wrong in CI:
        # a stack that failed to start would turn into 28 silent skips and a
        # green build. The wait step above fails loudly instead.
        run: pytest tests/e2e -v --tb=short

      - name: Container logs
        # Only on failure, and only the tail: an e2e failure is usually
        # explained by something the API or the worker logged, and hunting for
        # it by re-running locally wastes the run that already reproduced it.
        if: failure()
        run: |
          echo "=== ml-api ==="
          docker compose logs --tail 120 ml-api
          echo "=== worker ==="
          docker compose logs --tail 60 worker
          echo "=== api-gateway ==="
          docker compose logs --tail 40 api-gateway

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # 6. Real models
  # ---------------------------------------------------------------------------
  models:
    name: Real model export and validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [test]
    # Expensive: downloads ~250 MB of pretrained weights. Run it on the main
    # branch and on demand, not on every pull-request commit.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        # Model artifacts are stored in Git LFS. Without this, checkout
        # writes ~130-byte pointer TEXT files in their place - which exist
        # on disk, so any 'is the artifact present?' check passes, and the
        # failure only surfaces later as an unparseable ONNX file.
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install training dependencies
        # requirements-dev.txt, not a bare `pytest`. This job runs the test
        # suite, and pytest.ini declares asyncio_mode plus
        # asyncio_default_fixture_loop_scope. A bare install pulls the newest
        # pytest WITHOUT pytest-asyncio, so --strict-config rejects those
        # options and the job aborts with "Unknown config option" after
        # collecting every test. Installing the pinned dev stack keeps this
        # job's pytest identical to the one the test job uses.
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
                      -r requirements-train.txt -r requirements-dev.txt onnxscript

      - name: Export and register the models
        # Quantization is skipped: static quantization needs the dataset, and
        # downloading Tiny-ImageNet on every CI run is not worth the minutes.
        run: python scripts/prepare_models.py --skip-quantization

      - name: Validate the registry
        run: python -m models.registry validate

      - name: Run the model validation pipeline
        # This is the real gate: determinism, batch invariance, output sanity
        # and the sub-second latency requirement, against the real artifacts.
        run: python -m models.validation.validate --max-p95-ms 2000

      - name: Benchmark
        run: python -m models.optimization.benchmark --iterations 20 --warmup 5 --batch-sizes 1

      - name: Run the model integration tests
        run: pytest tests/integration/test_model_loading.py -v

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-reports
          path: benchmarks/reports/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Final gate
  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    # A single job to require in branch protection, rather than listing every
    # job by name and having to update the rule whenever one is added.
    needs: [lint, test, security, docker, e2e]
    if: always()

    steps:
      - name: Check the results
        run: |
          echo "lint:     ${{ needs.lint.result }}"
          echo "test:     ${{ needs.test.result }}"
          echo "security: ${{ needs.security.result }}"
          echo "docker:   ${{ needs.docker.result }}"
          echo "e2e:      ${{ needs.e2e.result }}"

          if [ "${{ needs.test.result }}" != "success" ] \
             || [ "${{ needs.lint.result }}" != "success" ] \
             || [ "${{ needs.docker.result }}" != "success" ] \
             || [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::CI failed"
            exit 1
          fi
          echo "All required checks passed."
