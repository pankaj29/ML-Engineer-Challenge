# =============================================================================
# Nginx API gateway.
#
# Plain English:
#   Nginx sits in front of the FastAPI containers. Every request hits Nginx
#   first, and it decides what to do with it. It exists here for four reasons
#   the application itself should not handle:
#
#   1. Load balancing. Spread requests across several API containers.
#   2. A first line of rate limiting. Nginx rejects a flood using almost no
#      resources. The API's own per-tier limiter is more precise but costs a
#      Redis round-trip, so it should not be the thing absorbing a DDoS.
#   3. Body size limits. A 2 GB upload is refused at the edge rather than
#      being streamed into a Python process first.
#   4. Keeping internal endpoints internal. /metrics is reachable from inside
#      the Docker network and nowhere else.
#
# Layered limits are deliberate: Nginx protects the infrastructure, the API
# enforces per-customer fairness. Neither alone is enough.
# =============================================================================

user nginx;
# "auto" matches the number of CPU cores the container is actually allowed.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------------------------------------------------------------- logs --
    # JSON access logs, matching the application's format so both can be
    # queried the same way. The correlation id is included so a request can be
    # followed from the edge through to the model.
    log_format json_combined escape=json
        '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"correlation_id":"$upstream_http_x_correlation_id",'
        '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ------------------------------------------------------------ transport --
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75s;
    types_hash_max_size 2048;

    # SECURITY: do not advertise the exact Nginx version. It tells an attacker
    # precisely which CVEs to try.
    server_tokens off;

    # --------------------------------------------------------------- limits --
    # 12 MB leaves headroom above the API's own 10 MB image limit, so a
    # slightly oversized upload gets the API's clear JSON error rather than
    # Nginx's bare HTML 413.
    client_max_body_size 12M;
    client_body_buffer_size 256k;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;

    # ---------------------------------------------------------- compression --
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain text/xml;
    # Images are already compressed; gzipping them burns CPU for nothing.

    # --------------------------------------------------------- rate limiting --
    # A "zone" is a shared-memory area holding per-IP counters. 10 MB tracks
    # roughly 160,000 addresses.
    #
    # These are infrastructure-level limits, set well above any individual
    # customer's tier limit. They exist to stop a flood, not to enforce
    # fairness - that is the API's job, where the caller's identity is known.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=inference_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    limit_req_status 429;
    limit_conn_status 429;

    # -------------------------------------------------------------- upstream --
    #
    # There is deliberately NO `upstream` block here, and that needs explaining
    # because an upstream block is the obvious way to write this.
    #
    # THE PROBLEM. nginx resolves the hostname in `server ml-api:8000;` exactly
    # once, when it loads its configuration, and then caches that IP for the
    # lifetime of the process. Docker hands out a new IP every time a container
    # is recreated. So the moment anyone runs
    #
    #     docker compose up -d --build ml-api
    #
    # the gateway is pointing at an address nothing is listening on, and every
    # request returns 502 until the gateway itself is restarted. Observed here:
    # nginx stuck on 172.20.0.5 for 22 hours while the API sat on 172.20.0.4,
    # with DNS resolving correctly the whole time. Nothing in the logs said
    # "stale DNS" - just `connect() failed (111: Connection refused)`.
    #
    # THE FIX. Putting the address in a *variable* forces nginx to consult the
    # resolver on each request instead of at startup. `valid=10s` caps how long
    # an answer is reused.
    #
    # WHAT IT COSTS. A variable target cannot reference an upstream block, so
    # this gives up two things:
    #
    #   * `least_conn` load balancing. Docker's DNS returns every replica's
    #     address and nginx round-robins them. For inference, where request
    #     cost varies a lot, least-connections would distribute better.
    #   * upstream keepalive, so connections are not pooled across requests.
    #
    # That is a real regression and it is accepted on purpose: a gateway that
    # silently breaks whenever the API is rebuilt is a much worse failure than
    # imperfect balancing. Restoring both needs either nginx Plus (which has
    # `resolve` on upstream servers) or a reload hook that restarts the gateway
    # whenever the API is recreated.
    #
    # 127.0.0.11 is Docker's embedded DNS server, on every user-defined network.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80 default_server;
        # Also listen on IPv6. Inside a container, `localhost` resolves to ::1
        # before 127.0.0.1, so an IPv4-only listener makes every healthcheck
        # that uses the name `localhost` fail with "connection refused" even
        # though the server is running perfectly.
        listen [::]:80 default_server;
        server_name _;

        # ------------------------------------------------- security headers --
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Shared proxy settings.
        proxy_http_version 1.1;
                proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass through the caller's correlation id when present, so a trace
        # spans the client, the gateway and the API.
        proxy_set_header X-Correlation-ID $http_x_correlation_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering off for inference: responses are small and latency matters
        # more than throughput here.
        proxy_buffering off;
        proxy_request_buffering on;

        # ------------------------------------------------ inference endpoints --
        location ~ ^/api/v1/(classify|detect|similarity) {
            limit_req zone=inference_limit burst=50 nodelay;
            limit_conn conn_limit 20;
            set $api_backend ml-api:8000;
            proxy_pass http://$api_backend;
        }

        # Batch submissions are heavier, so they get a tighter allowance.
        location /api/v1/batch {
            limit_req zone=inference_limit burst=10 nodelay;
            limit_conn conn_limit 5;
            # Batches can take longer to accept than a single image.
            proxy_read_timeout 120s;
            set $api_backend ml-api:8000;
            proxy_pass http://$api_backend;
        }

        # ------------------------------------------------------ health checks --
        # No rate limit: throttling a load balancer's health probe would cause
        # the very outage the probe exists to detect.
        location ~ ^/api/v1/health {
            access_log off;
            set $api_backend ml-api:8000;
            proxy_pass http://$api_backend;
        }

        # --------------------------------------------------------- metrics --
        # SECURITY: reachable only from inside the Docker network, so
        # Prometheus can scrape it and the public internet cannot.
        location /api/v1/metrics {
            allow 172.16.0.0/12;   # Docker's default bridge range
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;
            access_log off;
            set $api_backend ml-api:8000;
            proxy_pass http://$api_backend;
        }

        # ------------------------------------------------------ everything else --
        location / {
            limit_req zone=api_limit burst=200 nodelay;
            set $api_backend ml-api:8000;
            proxy_pass http://$api_backend;
        }

        # Custom JSON error pages, so a client never has to parse HTML to
        # discover that it was rate limited.
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":{"code":"RATE_LIMIT_EXCEEDED","message":"Too many requests. Slow down and retry shortly."}}';
        }

        error_page 502 503 504 = @upstream_down;
        location @upstream_down {
            default_type application/json;
            return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"The service is temporarily unavailable. Please retry."}}';
        }

        error_page 413 = @too_large;
        location @too_large {
            default_type application/json;
            return 413 '{"error":{"code":"IMAGE_TOO_LARGE","message":"The uploaded file exceeds the maximum allowed size."}}';
        }
    }
}
