apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mlcv

resources:
  - namespace.yaml
  - config.yaml
  - data.yaml
  - api.yaml
  - worker.yaml
  - ingress.yaml

labels:
  # includeSelectors: false on purpose. Adding a label to a Deployment's
  # selector makes it immutable-field-conflict on the next apply, because
  # selectors cannot be changed in place.
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: mlcv
