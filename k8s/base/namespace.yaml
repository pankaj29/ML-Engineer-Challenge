apiVersion: v1
kind: Namespace
metadata:
  name: mlcv
  labels:
    app.kubernetes.io/name: mlcv
    # Enforce the restricted Pod Security Standard. Every workload here
    # already runs non-root with no capabilities, so this codifies what is
    # true rather than demanding a change. Without it, a later manifest could
    # quietly ship a privileged container.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
