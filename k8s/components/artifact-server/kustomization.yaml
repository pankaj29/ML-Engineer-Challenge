apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Stands in for object storage on a cluster that has none. Referenced by the
# local overlays; a real cluster points ARTIFACT_SOURCE at S3 or an HTTPS host
# and never includes this.
#
# A Component rather than a plain resource list, so several overlays can pull
# it in without each one re-including the base.

resources:
  - artifact-server.yaml
