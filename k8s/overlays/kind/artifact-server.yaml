# Stands in for object storage. Only the kind overlay uses this; a real
# cluster points ARTIFACT_SOURCE at S3 or an HTTPS host.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifact-server
  namespace: mlcv
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: artifact-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: artifact-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: mlcv/artifact-server:kind
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /resnet50.onnx
              port: http
            periodSeconds: 5
          volumeMounts:
            # nginx-unprivileged writes its temp and pid files here, and the
            # root filesystem is read-only.
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: artifact-server
  namespace: mlcv
spec:
  selector:
    app.kubernetes.io/name: artifact-server
  ports:
    - port: 80
      targetPort: http
