apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Single-node overlay, used to verify the base manifests actually come up.
# `kubectl apply -k k8s/overlays/kind` on a kind cluster brings the whole
# stack to Ready.
#
# The base targets a real cluster: a ReadOnlyMany volume the API and worker
# both mount, and more replicas than one node wants. Neither holds here, so
# this patches the two things a single node cannot provide and nothing else.

namespace: mlcv

resources:
  - ../../base
  - artifact-server.yaml

patches:
  # Fetch the weights from the repo checkout instead of object storage. The
  # base points at an https:// artifact store; a laptop has the files already.
  - target:
      kind: ConfigMap
      name: mlcv-config
    patch: |-
      - op: replace
        path: /data/ARTIFACT_SOURCE
        value: "http://artifact-server"

  # One API replica. Two is right in production and pointless on one node,
  # and the PodDisruptionBudget's minAvailable of 1 would block eviction of
  # the only pod during a drain.
  - target:
      kind: Deployment
      name: ml-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: HorizontalPodAutoscaler
      name: ml-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1

  # Postgres asks for 20Gi, which a laptop running kind does not need to give.
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 2Gi


