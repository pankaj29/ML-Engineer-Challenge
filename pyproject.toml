# =============================================================================
# Tooling configuration.
#
# Plain English:
#   One file configures the formatter (black), the linter (ruff) and the type
#   checker (mypy). Keeping them here rather than in three separate files
#   means there is one place to look, and CI runs exactly what a developer
#   runs locally.
#
# The rule selection below is opinionated on purpose. A linter that flags
# hundreds of deliberate decisions gets switched off within a week, so every
# disabled rule carries a reason.
# =============================================================================

[project]
name = "ml-cv-api"
version = "1.0.0"
description = "Production multi-model computer vision API"
requires-python = ">=3.11"

# -----------------------------------------------------------------------------
# Black — formatting
# -----------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311", "py312"]
# 100 rather than black's default 88: the code is heavily type-annotated, and
# at 88 columns a single annotated signature wraps across four lines, which
# hurts readability more than the extra width does.
#
# Run black on the Python CI uses (3.11 or 3.12), not on 3.13. Same black
# version, same settings, different output: on 3.13 it expands a triple-quoted
# string passed as a sole argument onto its own line, and on 3.12 it hugs it
# against the parens. Formatting scripts/build_colab_notebook.py on 3.13 and
# pushing turns CI red with a 200-line diff that looks like nothing you wrote.

# -----------------------------------------------------------------------------
# Ruff — linting
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    "data",
    "models/artifacts",
    # Generated by scripts/build_colab_notebook.py, and written in notebook
    # idiom (grouped imports, shell magics) that does not match library style.
    # The generator itself IS linted, which is where the logic lives.
    "notebooks/*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors        — PEP 8
    "W",    # pycodestyle warnings
    "F",    # pyflakes                  — real bugs: unused names, undefined vars
    "I",    # isort                     — import ordering
    "N",    # pep8-naming
    "UP",   # pyupgrade                 — modern syntax for the target version
    "B",    # flake8-bugbear            — likely bugs (mutable defaults, etc.)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit             — security
    "A",    # flake8-builtins           — shadowing builtins
    "DTZ",  # flake8-datetimez          — naive datetimes are a real bug source
    "PTH",  # flake8-use-pathlib
]

ignore = [
    # --- Deliberate architectural choices ---------------------------------
    "BLE001",  # Blind `except Exception`.
               # Used on purpose throughout the graceful-degradation paths: a
               # failure in the cache, the metrics or the inference log must
               # NEVER break the request that triggered it. Each such handler
               # logs the exception and carries on. Narrowing these would mean
               # enumerating every exception three libraries can raise, and
               # missing one would cause the outage the handler exists to
               # prevent.
    "S110",    # try/except/pass.
               # Same reason: shutdown and best-effort metrics paths.
    "TRY003",  # Long messages outside an exception class.
               # Our error messages are deliberately long and user-facing.

    # --- False positives in this codebase ---------------------------------
    "S104",    # Binding to 0.0.0.0.
               # Correct and necessary inside a container.
    "S101",    # `assert`.
               # Fine in tests, which is where it is used.
    "S603",    # subprocess without shell=True — not used in serving code.
    "S607",    # Partial executable path — only in developer scripts.

    # --- Style preferences -------------------------------------------------
    "E501",    # Line too long.
               # Black already enforces the line length; ruff duplicating it
               # produces noise on long URLs and comments black cannot split.
    "N818",    # Exception names must end in "Error".
               # Ours do, except where the name reads better without it.
    "SIM108",  # Use a ternary instead of if/else.
               # An explicit if/else is often clearer for a reader who is not
               # already familiar with the code.
    "SIM105",  # Use contextlib.suppress instead of try/except/pass.
               # try/except/pass with a comment explaining WHY the exception is
               # ignored reads better than contextlib.suppress, which hides the
               # reason one import away.

    # --- Intentional in this codebase --------------------------------------
    "S311",    # Non-cryptographic random.
               # Correct for data augmentation, load-test image selection and
               # A/B bucket sampling. Nothing here uses random for a secret;
               # `secrets` is used where cryptographic strength is required.
    "E402",    # Import not at top of file.
               # Several entry-point scripts must insert the repository root
               # into sys.path BEFORE importing first-party packages, so that
               # `python models/optimization/foo.py` works as well as
               # `python -m models.optimization.foo`.
    "UP042",   # Inherit from StrEnum rather than (str, Enum).
               # `(str, Enum)` is kept for pydantic compatibility and because
               # it reads identically on 3.11 and 3.12.
    "RUF046",  # Unnecessary int() cast.
               # The explicit casts wrap NumPy scalars, which json.dumps
               # cannot serialise. Removing them breaks report generation.
    "RUF012",  # Mutable class attribute without ClassVar.
               # Used for Celery task-instance caches, which are mutable by design.
    "B008",    # Function call in a default argument.
               # This is exactly how FastAPI's Depends()/Query() are declared.
]

[tool.ruff.lint.per-file-ignores]
# Tests get more latitude: asserts are the point, and fixtures legitimately
# shadow names.
"tests/**" = [
    "S",      # security rules (hardcoded test credentials are intentional)
    "N802",   # test method naming
    "ARG",    # unused fixture arguments are how pytest injects them
    "PLR2004",  # "magic" numbers in assertions are the expected value
]
# Developer scripts print and use relative paths freely.
"scripts/**" = ["T201", "S607", "PTH", "SIM113"]
"models/**" = ["T201"]
# The provided starter scripts are left close to their original form, so
# that the diff against what was handed over stays readable.
"scripts/download_datasets.py" = ["ALL"]
"scripts/basic_cnn.py" = ["ALL"]
"scripts/sample_serving_script.py" = ["ALL"]
"scripts/tiny_imagenet_dataloader.py" = ["ALL"]
"scripts/models/**" = ["ALL"]
"scripts/testing/**" = ["ALL"]
"scripts/utils/**" = ["ALL"]
"scripts/setup/**" = ["ALL"]
"scripts/docker/**" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["api", "models", "worker", "db", "scripts", "tests"]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

# -----------------------------------------------------------------------------
# Mypy — type checking
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false   # tests and scripts are not fully annotated
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
show_error_codes = true
pretty = true

# Several dependencies ship no type stubs. Failing the build on a third
# party's missing annotations is not a useful signal.
[[tool.mypy.overrides]]
module = [
    "onnxruntime.*",
    "onnx.*",
    "torch.*",
    "torchvision.*",
    "ultralytics.*",
    "celery.*",
    "prometheus_client.*",
    "fakeredis.*",
    "locust.*",
    "pythonjsonlogger.*",
    "tensorrt.*",
    "pycuda.*",
    "scipy.*",
    "PIL.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
ignore_errors = true

# -----------------------------------------------------------------------------
# Coverage
# -----------------------------------------------------------------------------
[tool.coverage.run]
source = ["api", "worker", "models"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    # GPU-only code that cannot execute on a CPU runner, so counting it would
    # understate the coverage of code that CAN be tested.
    "models/optimization/export_tensorrt.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
precision = 1
show_missing = true
