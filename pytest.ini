[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support. "auto" means an async test needs no decorator, which keeps
# the suite readable.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    --strict-markers
    --strict-config
    -ra
    --tb=short

markers =
    slow: takes more than a second
    integration: crosses a component boundary
    performance: measures speed or memory
    requires_models: needs real model artifacts prepared
    e2e: drives the deployed Docker stack over HTTP; skips when it is not up

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
